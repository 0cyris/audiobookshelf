name: Sync master with upstream

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: git remote add upstream https://github.com/advplyr/audiobookshelf.git && git fetch upstream master

      - name: Merge upstream/master, or fail loudly on conflict
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream/master"
            exit 0
          fi

          # master carries fork-specific commits (CI, the PDF reader rewrite), so
          # this is a real merge, not a fast-forward
          if git merge --no-ff -m "Merge upstream/master into master" upstream/master; then
            git push origin master
            echo "Merged upstream/master ($(git rev-parse upstream/master)) into master"
          else
            git merge --abort
            echo "::error::Merging upstream/master produced conflicts. Merge it in manually: git fetch upstream master && git merge upstream/master"
            exit 1
          fi
